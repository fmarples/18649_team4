<text x="850" y="100" font-size="14">Mounting plan from manufacturer drawings</text>
<text x="850" y="124" font-size="14">Two soldered anchor pins: 25.40 mm pitch</text>
<text x="850" y="148" font-size="14">Recommended finished plated holes: 2.89 mm</text>
<text x="850" y="172" font-size="14">Sink: 41.91 wide x 25.40 deep x 25.40 high</text>
<text x="850" y="196" font-size="14">One M3 screw + nut through the device tab</text>
<text x="850" y="220" font-size="14">Sink screw center: 19.05 mm above base</text>
<text x="850" y="244" font-size="14"></text>
<text x="850" y="268" font-size="14">Green circles: proposed anchor pads/holes</text>
<text x="850" y="292" font-size="14">Dark blocks: conservative fin/web occupied space</text>
<text x="850" y="316" font-size="14">Orange outline: outer bounding rectangle</text>
<text x="850" y="340" font-size="14">Red parts: clearance-screen intersections</text>
<text x="850" y="364" font-size="14"></text>
<text x="850" y="388" font-size="14">Placement and local routing implemented.</text>
<text x="850" y="412" font-size="14">No unrelated courtyard in fin/web +0.5mm.</text>
<text x="850" y="436" font-size="14">No unrelated copper under top metal.</text>
<text x="850" y="460" font-size="14">U80/tab overlap is an explicit paired exception.</text>
<text x="850" y="484" font-size="14"></text>
<text x="850" y="508" font-size="14">Flush mount / 1.6 mm PCB height screen:</text>
<text x="850" y="532" font-size="14">Minimum lead projection, either row: 1.05 mm</text>
<text x="850" y="556" font-size="14">Lead bend above PCB: 0.95–1.40 mm</text>
<text x="850" y="580" font-size="14">Package bottom above PCB: 3.95–4.70 mm</text>
<text x="850" y="604" font-size="14">These are calculations, not physical fit tests.</text>
</g></svg>
