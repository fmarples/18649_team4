CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_LOAD_SIZE=0x40000
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_TIMERS=y
CONFIG_ASSERT=y
CONFIG_WATCHDOG=y
# Main installs the 1 s timeout; avoid the driver's separate boot-time timeout.
CONFIG_WDT_DISABLE_AT_BOOT=y
CONFIG_SPI=y
# Poll short MCP2515 transfers (measured faster than interrupt mode on Oct 21).
CONFIG_SPI_STM32_INTERRUPT=n
CONFIG_CAN_MCP2515=y
CONFIG_CAN_DEFAULT_BITRATE=500000
# One filter per catalog ID, for each controller.
CONFIG_CAN_MAX_FILTER=8
CONFIG_CAN_MCP2515_INT_THREAD_PRIO=2
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
# Crash reports: register dump plus a logged coredump on the serial console.
CONFIG_FAULT_DUMP=2
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_LOG_PRINTK=n
