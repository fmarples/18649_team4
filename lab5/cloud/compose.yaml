services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    networks: [private]
    restart: unless-stopped
  app:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      DASHBOARD_USER: ${DASHBOARD_USER:?set dashboard login}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?set password hash}
      UPLINK_TOKEN: ${UPLINK_TOKEN:?set a random token}
    networks: [private]
    depends_on: [redis]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set HTTPS hostname}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    networks: [private, public]
    depends_on: [app]
    restart: unless-stopped
networks:
  private:
    internal: true
  public: {}
volumes:
  redis-data: {}
  caddy-data: {}
  caddy-config: {}
