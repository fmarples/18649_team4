name: Lab 5 host checks
on:
  push:
    branches: [lab5]
    paths: ['lab5/**', '.github/workflows/lab5.yml']
  pull_request:
    paths: ['lab5/**', '.github/workflows/lab5.yml']
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r lab5/requirements-host.txt
      - run: python lab5/host/build.py
      - run: python -m unittest discover -s lab5/tests -v
