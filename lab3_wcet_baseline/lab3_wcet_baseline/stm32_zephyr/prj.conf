CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_PRINTK_SYNC=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_ASSERT=y
CONFIG_WATCHDOG=y
# Main installs the 1 s timeout; avoid the driver's separate boot-time timeout.
CONFIG_WDT_DISABLE_AT_BOOT=y
CONFIG_SPI=y
# Poll short MCP2515 transfers; the board default interrupt mode adds a per-byte IRQ and a sleep/wake per transaction.
CONFIG_SPI_STM32_INTERRUPT=n
CONFIG_CAN_MCP2515=y
CONFIG_CAN_DEFAULT_BITRATE=500000
# One software filter per catalog ID, for each controller.
CONFIG_CAN_MAX_FILTER=7
CONFIG_CAN_MCP2515_INT_THREAD_PRIO=2
CONFIG_EVENTS=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
# Per-activation heartbeat runtime, separate from elapsed GPIO pulses.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_FAULT_DUMP=2
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_MIN=y
CONFIG_LOG_PRINTK=n
