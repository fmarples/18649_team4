description: PWM-driven servo motor.
compatible: "pwm-servo"
include: base.yaml
properties:
  pwms:
    required: true
    type: phandle-array
    description: PWM specifier driving the servo motor.
  min-pulse:
    required: true
    type: int
    description: Manufacturer minimum pulse width in nanoseconds, not calibrated travel.
  max-pulse:
    required: true
    type: int
    description: Manufacturer maximum pulse width in nanoseconds, not calibrated travel.
