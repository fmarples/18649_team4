CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
# Console polling remains preemptible; never lock interrupts for a whole line.
CONFIG_PRINTK_SYNC=n
CONFIG_GPIO=y
CONFIG_CRC=y
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_MAIN_THREAD_PRIORITY=1
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_ASSERT=y
CONFIG_PWM=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_I2C=n
CONFIG_SPI=n
CONFIG_ADC=n
CONFIG_INPUT=n
